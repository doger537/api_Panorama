name: TTKMap CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttkmap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: python scripts/check_contracts.py
      - run: python scripts/generate_types.py --check
      - run: python scripts/render_workplan.py --check
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build
      - run: cp .env.example .env
      - run: docker compose --profile test build backend-test
      - run: docker compose --profile test run --rm backend-test python -m pytest backend/tests -q
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - run: npm --prefix frontend audit --audit-level=high
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --requirement backend/requirements.lock --disable-pip --no-deps
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results/
